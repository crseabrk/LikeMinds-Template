name: Validate LikeMinds scaffold

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate structure and protocol invariants
        run: python tools/validate.py
      - name: Validate LMTR conformance
        run: python tests/test_lmtr.py
      - name: Validate managed updater
        run: python tests/test_update.py
